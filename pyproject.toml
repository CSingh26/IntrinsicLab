[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
[project]
name = "intrinsiclab"
version = "1.0.0"
description = "Trace operating assumptions through cash flow, cost of capital, and equity valuation."
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "pydantic==2.12.5"]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.6", "mypy==1.19.1", "build==1.4.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
[tool.hatch.build.targets.wheel]
packages = ["src/intrinsiclab"]
